

<!DOCTYPE html>
<html lang="de">
  <head>
    <title>Familienplaner</title>
    <style>
   :root {
  --sage: #DFE8DC;
  --cream: #F8F7F2;
  --pink: #EBCBD3;
  --darkgreen: #34553E;
}   
      body {
 background-color: var(--cream); 
          font-family: Arial;
        color: #455F4D;
      }
      h1 {
        color: #455F4D;
      }
      button {
        background-color: #D7E5D6;
        padding: 15px;
        margin: 8px;
        min-width: 180px;
        border: none;
        border-radius: 12px:
        color: #455F4D;
        font-size: 18px;
        cursor: pointer;
        border-radius: 12px
      }
   .zaglavlje {
  background-color: var(--sage);
  padding: 30px;
  border-radius: 24px;
  margin-bottom: 25px;
}   
 .herzen {
  color: #C58FA0;
  font-size: 26px;
  letter-spacing: 10px;
  text-align: right;
  margin-bottom: 12px;
}     
 .meni {
  display: grid;     
 grid-template-columns: repeat(2, 1fr);
  gap: 16px;
max-width: 1200px;
  margin: 25px auto;
}

.meni p {
  margin: 0;
}

.meni button {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 28px 12px;
background-color: #E8F1E6;
  border: 1px solid #DFE8DC;
  border-radius: 20px;
  color: #34553E;
  font-size: 17px;
  transition: all 0.3s ease;
}   
.meni button:hover {
  background-color: #D7E8D3;
  transform: translateY(-3px);
}
 #naechsterTermin {
  background-color: #F1F7EF;
  border: 1px solid #DFE8DC;
  border-radius: 20px;
  box-shadow: 0 4px 12px rgba(52, 85, 62, 0.10); 
  padding: 25px;
  margin: 25px auto;
  max-width: 1150px;
  color: #34553E;
  font-size: 18px; 
}     
#naechsterTermin p:first-of-type {
  font-weight: bold;
}
 #naechsterTermin p:last-of-type {
   font-size: 21px;
   color: #34553E;
 }
   #naechsterTermin h2 { color:
     #B77F93; margin-bottom: 25px; }
 h2 { color: #34553E; }     
      </style>
  </head>
  <body>
  <div class="zaglavlje"> 
 <div class="herzen">♡ ♥ ♡</div>   
 <h1>Hallo, Familie! ♡</h1>
<p>Schön, dass ihr da seid. 🩷</p>
<p>Gemeinsam planen. Gemeinsam leben.</p>
 </div>   
<div class="meni">    
  <p><button>📅 Kalender</button></p>
<p><button>♡ Familie</button></p>
<p><button>🔔 Erinnerungen</button></p>
<p><button>🛒 Einkaufsliste</button></p>
 </div> 
 <div id="naechsterTermin">
  <h2>🌸 Unser nächster Termin</h2>
  <p>Keine bevorstehenden Termine.</p>
</div>   
    <h2>Unsere Termine</h2>
      <button onclick="document.getElementById('terminForm').hidden = false">
  Termin hinzufügen
</button>

<div id="terminForm" hidden>
  <h3>Neuer Termin</h3>
  <input type="text" id="terminName" placeholder="Was steht an?">
  <input type="date" id="terminDatum">
  <input type="time" id="terminZeit">
  <button onclick="speichereTermin()">Speichern</button>
</div>
    <div id="listaTermina"></div>
    <h2 style="color: #8A9B8A;">✅ 
    Verlauf</h2>
<div id="povijestTermina"></div>

  </body>
</html>
<script>
function speichereTermin() {
  let name = document.getElementById("terminName").value;
  let datum = document.getElementById("terminDatum").value;
  let zeit = document.getElementById("terminZeit").value;

  if (!name || !datum || !zeit) {
    alert("Bitte alle Felder ausfüllen!");
    return;
  }

  let liste = document.getElementById("listaTermina");

  let termin = document.createElement("p");
  termin.dataset.status = "offen";
 let lijepiDatum = datum.split("-").reverse().join(".");

termin.textContent = lijepiDatum + " - " + zeit + " - " + name;
let termini = JSON.parse(localStorage.getItem("termini")) || [];
let gumb = document.createElement("button");
gumb.textContent = "✓ Erledigt";
 gumb.onclick = function() {
let index = termini.findIndex(t =>
  t.name === name &&
  t.datum === datum &&
  t.zeit === zeit &&
  t.status !== "erledigt"
);

if (index !== -1) {
  termini[index].status = "erledigt";
}  
   localStorage.setItem("termini", JSON.stringify(termini));
  termin.style.textDecoration = "line-through";
  gumb.textContent = "✓ Erledigt!";
  gumb.disabled = true;
  document.getElementById("povijestTermina").appendChild(termin); 
location.reload();   
}; 
termin.appendChild(gumb);
let gumbUredi = document.createElement("button");
gumbUredi.textContent = "✏️ Bearbeiten";
gumbUredi.onclick = function() {
  let noviNaziv = prompt("Neuer Terminname:", name);
  if (noviNaziv === null || noviNaziv.trim() === "") return;
 let termini = JSON.parse(localStorage.getItem("termini")) || [];
let index = termini.findIndex(t =>
  t.name === name && t.datum === datum && t.zeit === zeit
);
if (index !== -1) {
  termini[index].name = noviNaziv;
  localStorage.setItem("termini", JSON.stringify(termini));
  location.reload();
}  
};
termin.appendChild(gumbUredi);  


let gumbBrisanje = document.createElement("button");
gumbBrisanje.textContent = "🗑️ Löschen";
gumbBrisanje.onclick = function() {
  if (confirm("Möchtest du diesen Termin wirklich löschen?")) {
    let termini = JSON.parse(localStorage.getItem("termini")) || [];
    let index = termini.findIndex(t =>
      t.name === name && t.datum === datum && t.zeit === zeit
    );
    if (index !== -1) {
      termini.splice(index, 1);
      localStorage.setItem("termini", JSON.stringify(termini));
      termin.remove();
    }
  }
};  
termin.appendChild(gumbBrisanje);  
let postojeciTermini = Array.from(liste.children);

let noviDatum = datum + zeit;

let sljedeciTermin = postojeciTermini.find(function(element) {
  return element.dataset.datum > noviDatum;
});

liste.insertBefore(termin, sljedeciTermin || null);
termin.dataset.datum = noviDatum;


termini.push({
  name: name,
  datum: datum,
  zeit: zeit,
  status: "offen"
});

localStorage.setItem("termini", JSON.stringify(termini));
document.getElementById("terminName").value = "";
document.getElementById("terminDatum").value = "";
document.getElementById("terminZeit").value = "";
}
</script>
<script>
window.addEventListener("DOMContentLoaded", function() {
  let termini = JSON.parse(localStorage.getItem("termini")) || [];
  let liste = document.getElementById("listaTermina");
termini.sort(function(a, b) {
  return (a.datum + a.zeit).localeCompare(b.datum + b.zeit);
});
  let sada = new Date();

let sljedeci = termini.find(function(t) {
  let datumTermina = new Date(t.datum + "T" + t.zeit);
  return t.status !== "erledigt" && datumTermina >= sada;
});

let kartica = document.getElementById("naechsterTermin");

if (sljedeci) {
  let datum = sljedeci.datum.split("-").reverse().join(".");
  kartica.innerHTML =
    "<h2>🌸 Unser nächster Termin</h2>" +
    "<p>" + datum + " um " + sljedeci.zeit + " Uhr</p>" +
    "<p>" + sljedeci.name + "</p>";
}
  termini.forEach(function(t) {
    let termin = document.createElement("p");
    termin.dataset.datum = t.datum + t.zeit;
    let datum = t.datum.split("-").reverse().join(".");

    termin.textContent = datum + " - " + t.zeit + " - " + t.name;
    if (t.status === "erledigt") {
  termin.style.textDecoration = "line-through";
} else {
  let gumb = document.createElement("button");
  gumb.textContent = "✓ Erledigt";

  gumb.onclick = function() {
    t.status = "erledigt";
    localStorage.setItem("termini", JSON.stringify(termini));
    termin.style.textDecoration = "line-through";
    gumb.textContent = "✓ Erledigt!";
    gumb.disabled = true;
    document.getElementById("povijestTermina").appendChild(termin);
   location.reload(); 
  };

  termin.appendChild(gumb);
 let gumbBrisanje = document.createElement("button");
gumbBrisanje.textContent = "🗑️ Löschen";
gumbBrisanje.onclick = function() {
  if (confirm("Möchtest du diesen Termin wirklich löschen?")) {
    let index = termini.indexOf(t);
    if (index !== -1) {
      termini.splice(index, 1);
      localStorage.setItem("termini", JSON.stringify(termini));
      termin.remove();
    }
  };
};      
termin.appendChild(gumbBrisanje);     
}
if (t.status === "erledigt") {
  document.getElementById("povijestTermina").appendChild(termin);
} else {
  liste.appendChild(termin);
} 
  });
});
  </script>
