<script>
(function () {
  const ansicht = document.getElementById("kalenderAnsicht");
  const raster = document.getElementById("kalenderRaster");
  const titel = document.getElementById("kalenderMonat");

  let monat = new Date();
  monat.setDate(1);

  function zeichneKalender() {
    raster.replaceChildren();

    titel.textContent = monat.toLocaleDateString("de-DE", {
      month: "long",
      year: "numeric"
    });

  ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].forEach(tag => {
  const feld = document.createElement("div");
  feld.className = "kalenderWochentag";
  feld.textContent = tag;
  raster.appendChild(feld);
}); 
    const jahr = monat.getFullYear();
    const monatszahl = monat.getMonth();
    const ersterTag = new Date(jahr, monatszahl, 1);
    const anzahlTage = new Date(jahr, monatszahl + 1, 0).getDate();
    const start = (ersterTag.getDay() + 6) % 7;

    for (let i = 0; i < start; i++) {
      raster.appendChild(document.createElement("div"));
    }

    let termine = [];
    try {
      termine = JSON.parse(localStorage.getItem("termini")) || [];
      if (!Array.isArray(termine)) termine = [];
    } catch (e) {
      termine = [];
    }

    const heute = new Date();

    for (let tag = 1; tag <= anzahlTage; tag++) {
      const feld = document.createElement("div");
      feld.className = "kalenderTag";

      if (
        tag === heute.getDate() &&
        monatszahl === heute.getMonth() &&
        jahr === heute.getFullYear()
      ) {
        feld.classList.add("kalenderHeute");
      }

      const nummer = document.createElement("strong");
      nummer.textContent = tag;
      feld.appendChild(nummer);

      const datum =
        jahr + "-" +
        String(monatszahl + 1).padStart(2, "0") + "-" +
        String(tag).padStart(2, "0");

      termine
        .filter(t => t.datum === datum && t.status !== "erledigt")
        .sort((a, b) => a.zeit.localeCompare(b.zeit))
        .forEach(t => {
          const eintrag = document.createElement("div");
          eintrag.className = "kalenderEintrag";
          eintrag.textContent = t.zeit + " " + t.name;
          feld.appendChild(eintrag);
        });

<script>
(function () {
  const ansicht = document.getElementById("familieAnsicht");
  const liste = document.getElementById("familieListe");
  const nameInput = document.getElementById("familieName");
  const farbeInput = document.getElementById("familieFarbe");

  function ladeMitglieder() {
    try {
      const daten = JSON.parse(
        localStorage.getItem("familieMitglieder") || "[]"
      );
      return Array.isArray(daten) ? daten : [];
    } catch (e) {
      return [];
    }
  }

 function zeigeMitglieder() {
  liste.replaceChildren();
  const mitglieder = ladeMitglieder();
document.getElementById("familieAnzahl").textContent = "(" + mitglieder.length + ")";

  if (mitglieder.length === 0) {
    const hinweis = document.createElement("p");
    hinweis.textContent = "Noch keine Familienmitglieder.";
    liste.appendChild(hinweis);
    return;
  }

  mitglieder.forEach(function (mitglied, index) {
    const karte = document.createElement("div");
    karte.className = "familieMitglied";
    karte.style.flexWrap = "wrap";

    const farbpunkt = document.createElement("span");
    farbpunkt.className = "familieFarbpunkt";
    farbpunkt.style.backgroundColor = mitglied.farbe;

    const name = document.createElement("strong");
    name.textContent = mitglied.name +
      (mitglied.rolle ? " · " + mitglied.rolle : "");

    const bearbeiten = document.createElement("button");
    bearbeiten.type = "button";
    bearbeiten.textContent = "✏️ Bearbeiten";

    bearbeiten.onclick = function () {
      const neuerName = prompt("Name:", mitglied.name);
      if (neuerName === null) return;
      if (!neuerName.trim()) {
        alert("Bitte einen Namen eingeben!");
        return;
      }

      const neueRolle = prompt(
        "Rolle (Mama, Papa, Kind):",
        mitglied.rolle || "Kind"
      );
      if (neueRolle === null) return;

      const rolle = neueRolle.trim();
      if (!["Mama", "Papa", "Kind"].includes(rolle)) {
        alert("Bitte Mama, Papa oder Kind eingeben!");
        return;
      }

      nameInput.value = neuerName.trim();
      document.getElementById("familieRolle").value = rolle;
      farbeInput.value = mitglied.farbe || "#A8C6B1";

      const farbBereich = document.createElement("div");
     farbBereich.className = "familieEditor";

      const farbe = document.createElement("input");
      farbe.type = "color";
      farbe.value = mitglied.farbe || "#A8C6B1";

      const speichern = document.createElement("button");
      speichern.type = "button";
      speichern.textContent = "✓ Speichern";

      speichern.onclick = function () {
        const daten = ladeMitglieder();
        daten[index] = {
          name: neuerName.trim(),
          rolle: rolle,
          farbe: farbe.value
        };
        localStorage.setItem(
          "familieMitglieder",
          JSON.stringify(daten)
        );
        nameInput.value = "";
        zeigeMitglieder();
      };

      const abbrechen = document.createElement("button");
      abbrechen.type = "button";
      abbrechen.textContent = "Abbrechen";
      abbrechen.onclick = function () {
        nameInput.value = "";
        farbBereich.remove();
      };

      farbBereich.append(farbe, speichern, abbrechen);
      karte.appendChild(farbBereich);
    };

    const loeschen = document.createElement("button");
    loeschen.type = "button";
    loeschen.textContent = "🗑️ Löschen";

    loeschen.onclick = function () {
      if (!confirm(
        "Möchtest du " + mitglied.name +
        " wirklich löschen?"
      )) return;

      const daten = ladeMitglieder();
      daten.splice(index, 1);
      localStorage.setItem(
        "familieMitglieder",
        JSON.stringify(daten)
      );
      zeigeMitglieder();
    };

const akcije = document.createElement("div");
akcije.className = "familieAktionen";
akcije.append(bearbeiten, loeschen);
karte.append(farbpunkt, name, akcije);
    liste.appendChild(karte);
  });
}
  document.getElementById("familieButton")
    .addEventListener("click", function () {
      zeigeMitglieder();
      ansicht.hidden = !ansicht.hidden;
     if (!ansicht.hidden) { ansicht.scrollIntoView({ behavior: "smooth" });

  document.getElementById("familieSpeichern")

      if (!name) {

      }

      const mitglieder = ladeMitglieder();
    mitglieder.push({
  name: name,
  rolle: document.getElementById("familieRolle").value,
  farbe: farbeInput.value
});

      localStorage.setItem(
        "familieMitglieder",

      nameInput.value = "";
      zeigeMitglieder();

  document.getElementById("familieZurueck")
    .addEventListener("click", function () {
      ansicht.hidden = true;
      document.querySelector(".meni")
        .scrollIntoView({ behavior: "smooth" });
    });
})();
</script>
<script>
(function () {
  const fotoInput = document.getElementById("familienFoto");
  if (!fotoInput) return;

  let positionX = Number(localStorage.getItem("fotoX") ?? 50);
  let positionY = Number(localStorage.getItem("fotoY") ?? 50);

  function zeigeFamilienFoto(bild) {
    document.body.style.backgroundImage = `url("${bild}")`;
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition =
      `${positionX}% ${positionY}%`;
    document.body.style.backgroundAttachment = "fixed";
  }

  const gespeichertesFoto = localStorage.getItem("familienFoto");
  if (gespeichertesFoto) zeigeFamilienFoto(gespeichertesFoto);

  const bereich = document.createElement("div");
  bereich.style.cssText =
    "text-align:center;margin:10px auto;";

  bereich.innerHTML = `
    <button type="button" id="bildAnpassen"
      style="background:#DDEBDD;color:#34553E;
      border:1px solid #DFE8DC;border-radius:12px;
      padding:10px 18px;cursor:pointer;">
      📷 Bild anpassen
    </button>
    <div id="bildEditor" hidden
      style="max-width:650px;margin:15px auto;
      padding:15px;background:#F8F7F2;
      border-radius:18px;">
      <p>Bild mit Maus oder Finger verschieben</p>
      <div id="bildVorschau"
        style="height:280px;border-radius:12px;
        background-size:cover;
        background-repeat:no-repeat;
        background-position:center;
        touch-action:none;cursor:grab;">
      </div>
      <button type="button" id="bildSpeichern"
        style="margin-top:12px;padding:10px 20px;
        border:0;border-radius:12px;
        background:#DDEBDD;color:#34553E;">
        Speichern
      </button>
    </div>
  `;

  fotoInput.parentElement.after(bereich);

  const editor = document.getElementById("bildEditor");
  const vorschau = document.getElementById("bildVorschau");

  function aktualisieren() {
    const bild = localStorage.getItem("familienFoto");
    if (!bild) return;
    vorschau.style.backgroundImage = `url("${bild}")`;
    vorschau.style.backgroundPosition =
      `${positionX}% ${positionY}%`;
    zeigeFamilienFoto(bild);
  }

  document.getElementById("bildAnpassen").onclick = function () {
    if (!localStorage.getItem("familienFoto")) {
      alert("Bitte zuerst ein Foto auswählen.");
      return;
    }
    editor.hidden = !editor.hidden;
    aktualisieren();
  };

  let startX, startY, altX, altY;

  vorschau.addEventListener("pointerdown", function (e) {
    startX = e.clientX;
    startY = e.clientY;
    altX = positionX;
    altY = positionY;
    vorschau.setPointerCapture(e.pointerId);
  });

  vorschau.addEventListener("pointermove", function (e) {
    if (!vorschau.hasPointerCapture(e.pointerId)) return;

    const breite = vorschau.clientWidth;
    const hoehe = vorschau.clientHeight;

    positionX = Math.max(0, Math.min(100,
      altX - (e.clientX - startX) / breite * 100));

    positionY = Math.max(0, Math.min(100,
      altY - (e.clientY - startY) / hoehe * 100));

    aktualisieren();
  });

  document.getElementById("bildSpeichern").onclick = function () {
    localStorage.setItem("fotoX", positionX);
    localStorage.setItem("fotoY", positionY);
    editor.hidden = true;
  };

  fotoInput.addEventListener("change", function (event) {
    const datei = event.target.files[0];
    if (!datei) return;

    const reader = new FileReader();

    reader.onload = function (e) {
      const bild = new Image();

      bild.onload = function () {
        const canvas = document.createElement("canvas");
        const faktor = Math.min(
          1, 1200 / Math.max(bild.width, bild.height)
        );

        canvas.width = Math.round(bild.width * faktor);
        canvas.height = Math.round(bild.height * faktor);

        const ctx = canvas.getContext("2d");
        ctx.drawImage(bild, 0, 0, canvas.width, canvas.height);

        const klein = canvas.toDataURL("image/jpeg", 0.7);

        try {
          localStorage.setItem("familienFoto", klein);
          positionX = 50;
          positionY = 50;
          localStorage.setItem("fotoX", positionX);
          localStorage.setItem("fotoY", positionY);
          aktualisieren();
        } catch (fehler) {
          alert("Nicht genug Speicherplatz für das Foto.");
        }
      };

      bild.src = e.target.result;
    };

    reader.readAsDataURL(datei);
  });
})();
</script>
