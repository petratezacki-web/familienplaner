

<!DOCTYPE html>
<html lang="de">
  <head>
    <title>Familienplaner</title>
    <style>
      body {
        background-color: #F5F3E9;
          font-family: Arial;
        color: #455F4D;
      }
      h1 {
        color: #455F4D;
      }
      button {
        background-color: #D7E5D6;
        padding: 15px;
        margin: 8px;
        min-width: 180px;
        border: none;
        border-radius: 12px:
        color: #455F4D;
        font-size: 18px;
        cursor: pointer;
      }
      </style>
  </head>
  <body>
    <h1>Unser Familienplaner</h1>
      <p>Gemeinsam den Alltag planen.</p>
      <h2>Unsere Termine</h2>
      <button onclick="document.getElementById('terminForm').hidden = false">
  Termin hinzufügen
</button>

<div id="terminForm" hidden>
  <h3>Neuer Termin</h3>
  <input type="text" id="terminName" placeholder="Was steht an?">
  <input type="date" id="terminDatum">
  <input type="time" id="terminZeit">
  <button onclick="speichereTermin()">Speichern</button>
</div>
    <div id="listaTermina"></div>
    <p><button>Kalender</button></p>
    <p><button>Familie</button></p>
    <p><button>Erinnerungen</button></p>
    <p><button>Einkaufsliste</button></p>
  </body>
</html>
<script>
function speichereTermin() {
  let name = document.getElementById("terminName").value;
  let datum = document.getElementById("terminDatum").value;
  let zeit = document.getElementById("terminZeit").value;

  if (!name || !datum || !zeit) {
    alert("Bitte alle Felder ausfüllen!");
    return;
  }

  let liste = document.getElementById("listaTermina");

  let termin = document.createElement("p");
  termin.dataset.status = "offen";
 let lijepiDatum = datum.split("-").reverse().join(".");

termin.textContent = lijepiDatum + " - " + zeit + " - " + name;
let termini = JSON.parse(localStorage.getItem("termini")) || [];
let gumb = document.createElement("button");
gumb.textContent = "✓ Erledigt";
 gumb.onclick = function() {
let index = termini.findIndex(t =>
  t.name === name &&
  t.datum === datum &&
  t.zeit === zeit &&
  t.status !== "erledigt"
);

if (index !== -1) {
  termini[index].status = "erledigt";
}  
   localStorage.setItem("termini", JSON.stringify(termini));
  termin.style.textDecoration = "line-through";
  gumb.textContent = "✓ Erledigt!";
  gumb.disabled = true;
}; 
termin.appendChild(gumb);
let postojeciTermini = Array.from(liste.children);

let noviDatum = datum + zeit;

let sljedeciTermin = postojeciTermini.find(function(element) {
  return element.dataset.datum > noviDatum;
});

liste.insertBefore(termin, sljedeciTermin || null);
termin.dataset.datum = noviDatum;


termini.push({
  name: name,
  datum: datum,
  zeit: zeit,
  status: "offen"
});

localStorage.setItem("termini", JSON.stringify(termini));
document.getElementById("terminName").value = "";
document.getElementById("terminDatum").value = "";
document.getElementById("terminZeit").value = "";
}
</script>
<script>
window.addEventListener("DOMContentLoaded", function() {
  let termini = JSON.parse(localStorage.getItem("termini")) || [];
  let liste = document.getElementById("listaTermina");
termini.sort(function(a, b) {
  return (a.datum + a.zeit).localeCompare(b.datum + b.zeit);
});
  termini.forEach(function(t) {
    let termin = document.createElement("p");
    termin.dataset.datum = t.datum + t.zeit;
    let datum = t.datum.split("-").reverse().join(".");

    termin.textContent = datum + " - " + t.zeit + " - " + t.name;
    if (t.status === "erledigt") {
  termin.style.textDecoration = "line-through";
} else {
  let gumb = document.createElement("button");
  gumb.textContent = "✓ Erledigt";

  gumb.onclick = function() {
    t.status = "erledigt";
    localStorage.setItem("termini", JSON.stringify(termini));
    termin.style.textDecoration = "line-through";
    gumb.textContent = "✓ Erledigt!";
    gumb.disabled = true;
  };

  termin.appendChild(gumb);
}
    liste.appendChild(termin);
  });
});
  </script>
